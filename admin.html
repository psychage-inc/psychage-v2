<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />

  <title>Psychage Admin</title>
  <link rel="icon" type="image/png" href="/images/logo.png" />

  <!-- Fonts -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter/Inter-Variable.woff2" crossorigin>

  <style>
    /* Inter (SIL OFL-1.1), self-hosted Latin variable subset. */
    @font-face {
      font-family: 'Inter';
      src: url('/fonts/inter/Inter-Variable.woff2') format('woff2-variations'),
           url('/fonts/inter/Inter-Variable.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html.dark body {
      background-color: #020617;
      color: #f8fafc;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    html.dark ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    html.dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }
  </style>
</head>

<body>
  <div id="admin-diag" style="padding:2rem;font-family:Inter,system-ui,sans-serif;color:#94a3b8;text-align:center;font-size:0.875rem;">
    Admin panel loading&hellip;
  </div>
  <div id="root"></div>
  <script type="module" src="/src/admin-index.tsx"></script>
</body>

</html>
